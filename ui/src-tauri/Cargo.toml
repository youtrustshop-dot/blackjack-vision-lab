[package]
name = "blackjack-vision-lab"
version = "1.0.1"
description = "Local blackjack perception and decision research laboratory"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde_json = "1"

[profile.release]
opt-level = 1
lto = false
codegen-units = 16
strip = true
panic = "abort"
