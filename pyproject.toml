[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "blackjack-vision-lab"
version = "1.0.0"
description = "Reproducible blackjack simulator, visual state reconstruction and mathematical analysis laboratory"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "numpy>=2.0", "Pillow>=10", "opencv-python-headless>=4.10", "mss>=10"]

[project.urls]
Repository = "https://github.com/youtrustshop-dot/blackjack-vision-lab"
Issues = "https://github.com/youtrustshop-dot/blackjack-vision-lab/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27"]
ml = ["onnxruntime>=1.20"]

[project.scripts]
bjlab = "bjlab.cli:main"

[tool.setuptools.packages.find]
include = ["bjlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
